<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Altalaya</title>
    <meta
      http-equiv="refresh"
      content="2;url=https://play.google.com/store/apps/details?id=com.altalaya.app"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #131313;
        color: #e5e2e1;
        text-align: center;
        padding: 24px;
      }
      a {
        color: #ff7a00;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Opening Altalaya…</p>
      <p>
        <a
          href="https://play.google.com/store/apps/details?id=com.altalaya.app"
          >Get it on Google Play</a
        >
      </p>
    </main>
    <script>
      (function () {
        var play =
          "https://play.google.com/store/apps/details?id=com.altalaya.app";
        var path = location.pathname + location.search + location.hash;
        var ua = navigator.userAgent || "";
        if (/android/i.test(ua)) {
          var intent =
            "intent://" +
            location.host +
            path +
            "#Intent;scheme=https;package=com.altalaya.app;S.browser_fallback_url=" +
            encodeURIComponent(play) +
            ";end";
          location.replace(intent);
          return;
        }
        location.replace(play);
      })();
    </script>
  </body>
</html>
